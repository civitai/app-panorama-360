<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Panorama 360 cover">
  <!-- Panorama 360 cover — "Generate a world, not a picture."
       Layered flat triangular ranges receding from dark at the bottom edge to pale at the
       skyline, with one warm sun low on the horizon centre-right.

       🔴 SEAMLESS BY CONSTRUCTION. This asset is generated by scripts/gen-panorama.sh, not
       drawn by hand and not sampled: every range is a triangular wave whose period divides
       1600 exactly, so both edges land on the same valley at the same y. Three generated
       attempts missed the seam by 35x, 22x and 21x the image's own interior continuity
       baseline — a diffusion sampler cannot close a loop, and for an app whose entire pitch
       is "no seam" that was the one defect that refutes itself.
       Palette: sky #2D9CFF · ranges #A8D6FF / #5FB3FF / #1B6FCC · sun #FF9E5E. -->
  <rect width="1600" height="900" fill="#2D9CFF"/>
  <circle cx="1080" cy="380" r="56" fill="#FF9E5E"/>
  <polygon fill="#A8D6FF" points="0.0,430.0 200.0,381.0 400.0,430.0 600.0,330.5 800.0,430.0 1000.0,330.5 1200.0,430.0 1400.0,381.0 1600.0,430.0 1600,900 0,900" />
