  <polygon fill="#1B6FCC" points="0.0,700.0 100.0,636.3 200.0,700.0 300.0,606.4 400.0,700.0 500.0,564.1 600.0,700.0 700.0,534.2 800.0,700.0 900.0,534.2 1000.0,700.0 1100.0,564.1 1200.0,700.0 1300.0,606.4 1400.0,700.0 1500.0,636.3 1600.0,700.0 1600,900 0,900" />
