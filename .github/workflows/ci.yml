name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same ref cancels the run still going for the older one
# (runner savings, same design as civitai/civitai#6718 / #6728): on a PR the
# ref is refs/pull/N/merge, on a branch push it is the branch. There is no
# deploy here, so a cancelled intermediate run loses nothing; the newest run
# checks a tree that contains every older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
